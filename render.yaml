# Blueprint de Render: backend (Express + Socket.IO) + Postgres.
# Render → New → Blueprint → elegir este repo → Apply.
services:
  - type: web
    name: quizlivee-server # → https://quizlivee-server.onrender.com (es la URL que usa netlify.toml)
    runtime: node
    plan: free
    autoDeploy: true # cada push a main se despliega solo
    buildCommand: npx --yes pnpm@11.0.8 install --frozen-lockfile
    startCommand: cd server && npm run start # aplica migraciones y arranca
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: quizlivee-db
          property: connectionString
      # La clave de anfitrión se escribe en el panel de Render (no vive en el repo).
      - key: HOST_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        # Vercel (el link que usa la gente) y Netlify (el anterior, por si alguien tiene el link viejo)
        value: https://quizlivee.vercel.app,https://quizlivee.netlify.app,http://localhost:5173

databases:
  - name: quizlivee-db
    plan: free
    databaseName: quiz
    user: quiz
