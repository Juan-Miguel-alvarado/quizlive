name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz
      CLIENT_ORIGIN: http://localhost:5173
      HOST_PASSWORD: anfitrion
      SESSION_SECRET: clave-de-prueba-para-integracion-continua

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test

      - name: Migraciones
        run: pnpm --filter server exec prisma migrate deploy

      - name: Partida completa (e2e por sockets)
        run: |
          pnpm --filter server exec tsx src/index.ts &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health && break; sleep 1; done
          pnpm --filter server exec tsx scripts/e2e.ts

      - name: Build del frontend
        run: pnpm --filter client build
