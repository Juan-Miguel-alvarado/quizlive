# Netlify publica solo el frontend. El backend (Socket.IO + Postgres) va en Railway/Render.
[build]
  command = "pnpm --filter client build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24"
  # Backend desplegado con render.yaml
  VITE_SERVER_URL = "https://quizlivee-server.onrender.com"
  # La dirección que se anuncia a los jugadores (QR y link): el sitio principal ahora está en Vercel
  VITE_PUBLIC_URL = "https://quizlivee.vercel.app"

# SPA: cualquier ruta (/host, /play…) la resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
